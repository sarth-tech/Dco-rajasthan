# ════════════════════════════════════════════════════════
#   जनगणना राजस्थान — Application Configuration
#   Rajasthan Census Website — Spring Boot
# ════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────
server.port=8080

# ── Application Name ────────────────────────────────────
spring.application.name=rajasthan-census

# ── JSP View Resolver ───────────────────────────────────
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── Encoding (critical for Hindi / Devanagari text) ─────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.web.resources.static-locations=classpath:/static/

# ── Jackson (JSON formatting) ────────────────────────────
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── DevTools ─────────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ── Logging ──────────────────────────────────────────────
logging.level.com.census=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{30} - %msg%n
